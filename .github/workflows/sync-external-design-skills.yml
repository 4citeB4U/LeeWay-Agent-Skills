name: Sync External Design Skills

on:
  push:
    branches: [main]
    paths:
      - 'scripts/external-design-skills.json'
      - 'scripts/sync-external-design-skills.ps1'
      - '.github/workflows/sync-external-design-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize approved skill sources
        shell: pwsh
        run: ./scripts/sync-external-design-skills.ps1

      - name: Validate synchronized skill files
        shell: pwsh
        run: |
          $count = @(Get-ChildItem ./skills/external -Filter SKILL.md -File -Recurse).Count
          if ($count -lt 16) { throw "Expected at least 16 synchronized SKILL.md files, found $count" }
          Write-Host "Validated $count synchronized SKILL.md files"

      - name: Commit synchronized payloads and receipt
        shell: bash
        run: |
          if git diff --quiet -- skills/external receipts/external-design-skills-sync.json; then
            echo "No upstream skill changes detected."
            exit 0
          fi
          git config user.name "leeway-skills-sync[bot]"
          git config user.email "leeway-skills-sync[bot]@users.noreply.github.com"
          git add skills/external receipts/external-design-skills-sync.json
          git commit -m "Sync canonical external design skills [skip ci]"
          git push origin HEAD:main
