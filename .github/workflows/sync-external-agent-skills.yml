name: Sync External Agent Skills

on:
  push:
    branches: [main]
    paths:
      - 'scripts/external-agent-skills.json'
      - 'scripts/sync-external-agent-skills.ps1'
      - '.github/workflows/sync-external-agent-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize approved general Agent Skill sources
        shell: pwsh
        run: ./scripts/sync-external-agent-skills.ps1

      - name: Validate each declared source produced SKILL.md
        shell: pwsh
        run: |
          $manifest = Get-Content ./scripts/external-agent-skills.json -Raw | ConvertFrom-Json
          foreach ($source in $manifest.sources) {
            $upstream = Join-Path $source.destination 'upstream'
            $count = @(Get-ChildItem -LiteralPath $upstream -Filter SKILL.md -File -Recurse -ErrorAction SilentlyContinue).Count
            if ($count -lt 1) { throw "No synchronized SKILL.md found for $($source.id)" }
            Write-Host "$($source.id): $count SKILL.md file(s)"
          }

      - name: Commit synchronized payloads and receipt
        shell: bash
        run: |
          if git diff --quiet -- skills/external receipts/external-agent-skills-sync.json; then
            echo "No upstream Agent Skill changes detected."
            exit 0
          fi
          git config user.name "leeway-skills-sync[bot]"
          git config user.email "leeway-skills-sync[bot]@users.noreply.github.com"
          git add skills/external receipts/external-agent-skills-sync.json
          git commit -m "Sync canonical external agent skills [skip ci]"
          git push origin HEAD:main
