name: Agent Skills Teaching Transfer Contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  teaching-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test skills/leeway-learning-ledger/tests/teaching-transfer.test.mjs
