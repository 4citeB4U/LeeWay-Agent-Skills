name: Deploy LeeWay Agent Skills Pages

on:
  push:
    branches: [main]
    paths:
      - 'grapevine/**'
      - 'skills/**'
      - 'receipts/agent-lee-capability-recovery-20261001.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical skills repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize uploaded Grapevine project
        shell: bash
        run: |
          rm -rf .grapevine-build
          mkdir -p .grapevine-build
          unzip -q grapevine/leeway-grapevine-actual-fixed.zip -d .grapevine-build

      - name: Generate canonical 499-skill Grapevine registry
        run: node .grapevine-build/scripts/generate-grapevine-state.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.grapevine-build/public/grapevine-state.json"

      - name: Install Grapevine dependencies
        working-directory: .grapevine-build
        run: npm install --no-audit --no-fund

      - name: Type-check actual Grapevine project
        working-directory: .grapevine-build
        run: npm run lint

      - name: Build actual Grapevine project
        working-directory: .grapevine-build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload actual Grapevine build
        uses: actions/upload-pages-artifact@v3
        with:
          path: .grapevine-build/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
