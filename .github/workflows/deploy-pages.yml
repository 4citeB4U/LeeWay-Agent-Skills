name: Deploy LeeWay Agent Skills Pages

on:
  push:
    branches: [main]
    paths:
      - 'grapevine-app/**'
      - 'skills/**'
      - 'receipts/agent-lee-capability-recovery-20261001.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical skills repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate canonical Grapevine registry
        run: node grapevine-app/scripts/generate-grapevine-state.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/grapevine-app/public/grapevine-state.json"

      - name: Install Grapevine dependencies
        working-directory: grapevine-app
        run: npm install --no-audit --no-fund

      - name: Type-check actual Grapevine
        working-directory: grapevine-app
        run: npm run lint

      - name: Build actual Grapevine
        working-directory: grapevine-app
        run: npm run build

      - name: Verify actual build
        shell: bash
        run: |
          test -f grapevine-app/dist/index.html
          grep -q "Grapevine 3D Registry" grapevine-app/dist/index.html
          test -f grapevine-app/dist/grapevine-state.json
          node -e "const x=require('./grapevine-app/dist/grapevine-state.json'); if(x.counts.canonicalSkillMd!==499||x.schemaVersion!=='leeway.grapevine.registry.v2') process.exit(2)"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload actual Grapevine build
        uses: actions/upload-pages-artifact@v3
        with:
          path: grapevine-app/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
