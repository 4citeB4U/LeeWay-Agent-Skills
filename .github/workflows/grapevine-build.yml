name: Grapevine Build Qualification

on:
  push:
    branches: [repair/actual-grapevine-ui-20261007, repair/grape-orb-mobile-basket-20261007, repair/tree-category-labels-20261007, repair/grapevine-section-nameplates-20261007]
    paths:
      - 'grapevine-app/**'
      - '.github/workflows/grapevine-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical registry
        run: node grapevine-app/scripts/generate-grapevine-state.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/grapevine-app/public/grapevine-state.json"
      - name: Install
        working-directory: grapevine-app
        run: npm install --no-audit --no-fund
      - name: Type-check actual Grapevine
        working-directory: grapevine-app
        run: npm run lint
      - name: Build actual Grapevine
        working-directory: grapevine-app
        run: npm run build
      - name: Verify build markers
        shell: bash
        run: |
          test -f grapevine-app/dist/index.html
          grep -q "Grapevine 3D Registry" grapevine-app/dist/index.html
          test -f grapevine-app/dist/grapevine-state.json
          node -e "const x=require('./grapevine-app/dist/grapevine-state.json'); if(x.counts.canonicalSkillMd!==499||x.schemaVersion!=='leeway.grapevine.registry.v2') process.exit(2)"
