<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>LeeWay Agent Voice</title><style>
:root{--bg:#07111f;--panel:#0d1b2e;--line:#243d60;--text:#edf5ff;--muted:#93a7c3;--cyan:#6ddcff;--green:#72e5a1;--amber:#ffd27a;--red:#ff8796}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17365b 0,#07111f 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:18px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:20px}.brand span{display:block;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}
.hero{text-align:center;padding:34px 0 18px}.orb{width:154px;height:154px;border-radius:50%;margin:auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#8de9ff,#286fa4 38%,#10243b 70%);box-shadow:0 0 55px #4ec8ff45;border:1px solid #8de9ff66;transition:.2s}.orb.listening{transform:scale(1.05);box-shadow:0 0 85px #6ddcff99}.orb.speaking{animation:pulse 1.2s infinite}.orb.thinking{animation:spin 2.8s linear infinite}@keyframes pulse{50%{transform:scale(1.06)}}@keyframes spin{50%{filter:hue-rotate(35deg)}}
.state{font-weight:700;margin-top:18px}.sub{color:var(--muted);font-size:13px;margin-top:5px}
.controls{display:flex;justify-content:center;gap:12px;margin:20px 0}.round{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:#12243b;color:white;font-size:27px}.round.primary{background:var(--cyan);color:#04101a}.round.stop{background:#351a25;color:#ffb4bf}
.card{background:#0d1b2ed9;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;backdrop-filter:blur(10px)}textarea{width:100%;min-height:76px;background:#07111f;color:white;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;resize:vertical}.send{width:100%;padding:12px;border:0;border-radius:11px;background:#d9efff;color:#07111f;font-weight:800;margin-top:8px}
.msg{padding:12px 13px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.user{background:#173451;margin-left:12%}.agent{background:#14271e;margin-right:12%}.small{font-size:12px;color:var(--muted)}details summary{cursor:pointer;color:#cfe4ff}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#050b13;padding:10px;border-radius:10px;max-height:280px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#091522;border-radius:10px;padding:9px}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
select{width:100%;background:#07111f;color:white;border:1px solid var(--line);padding:10px;border-radius:10px}.load{width:100%;margin-top:8px;padding:11px;border-radius:10px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);font-weight:700}
</style></head><body><main>
<div class="top"><div class="brand"><b>LeeWay Agent Voice</b><span>Universal Voice Bus • Small-Model Test</span></div><div class="pill" id="runtime">Booting</div></div>
<section class="hero"><div class="orb" id="orb"><span style="font-size:54px">L</span></div><div class="state" id="state">Ready</div><div class="sub" id="hint">Load the model, then tap the microphone.</div></section>
<div class="controls"><button class="round primary" id="mic" aria-label="Talk">🎙</button><button class="round stop" id="interrupt" aria-label="Interrupt">■</button></div>
<div class="card"><label class="small">Local model</label><select id="model"><option value="HuggingFaceTB/SmolLM2-1.7B-Instruct">SmolLM2 1.7B Instruct</option><option value="Qwen/Qwen2.5-1.5B-Instruct">Qwen2.5 1.5B Instruct</option></select><button class="load" id="load">Load model on this device</button><div class="small" id="modelState">Not loaded. First load downloads model files to your browser cache.</div></div>
<div class="card"><div id="chat"></div><textarea id="text" placeholder="Or type here if microphone transcription is unavailable…"></textarea><button class="send" id="send">Send to Agent Voice</button></div>
<details class="card"><summary>Diagnostics / Formula evidence</summary><div class="grid"><div class="stat">WebGPU<br><b id="gpu">—</b></div><div class="stat">Mic speech API<br><b id="sr">—</b></div><div class="stat">Speech output<br><b id="tts">—</b></div><div class="stat">Epoch<br><b id="epoch">0</b></div></div><pre id="trace"></pre></details>
<script type="module">
const $=x=>document.getElementById(x);let pipe=null,epoch=0,recognizer=null;const events=[];const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function ev(type,data={}){const e={sessionId:"leeway-agent-voice",eventId:crypto.randomUUID(),eventType:type,monotonicTimestamp:performance.now(),generationEpoch:epoch,source:"browser",...data};events.push(e);$("trace").textContent=events.slice(-60).map(x=>JSON.stringify(x)).join("\n");$("epoch").textContent=epoch;return e}
function state(s,h,c=""){$("state").textContent=s;$("hint").textContent=h;$("orb").className="orb "+c}
function msg(role,text){const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"agent");d.textContent=text;$("chat").appendChild(d);d.scrollIntoView({behavior:"smooth"});}
$("gpu").textContent=navigator.gpu?"YES":"NO / WASM";$("sr").textContent=SR?"YES":"NO";$("tts").textContent=("speechSynthesis"in window)?"YES":"NO";$("runtime").textContent="Browser ready";ev("SEMANTIC_EVENT",{name:"APP_READY"});
$("load").onclick=async()=>{try{state("Loading model","This can take a while on first download.","thinking");$("modelState").textContent="Loading runtime…";ev("SEMANTIC_EVENT",{name:"MODEL_LOAD_START",model:$("model").value});const {pipeline}=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2");const opts={device:navigator.gpu?"webgpu":"wasm",dtype:"q4"};pipe=await pipeline("text-generation",$("model").value,opts);$("modelState").innerHTML='<span class="ok">Loaded locally: '+$("model").value+"</span>";state("Ready","Tap the microphone and speak.");ev("SEMANTIC_EVENT",{name:"MODEL_LOAD_OK",model:$("model").value,device:opts.device})}catch(e){$("modelState").innerHTML='<span class="bad">Model load failed: '+String(e)+"</span>";state("Model load failed","Open Diagnostics for the exact error.");ev("ERROR",{stage:"model_load",message:String(e)})}};
function stopAll(reason="user_interrupt"){epoch++;if(recognizer)try{recognizer.abort()}catch{};if("speechSynthesis"in window)speechSynthesis.cancel();state("Interrupted","Ready for your next turn.");ev("CONTROL_CANCEL",{reason,newEpoch:epoch})}
$("interrupt").onclick=()=>stopAll();
function speak(text,myEpoch){if(!("speechSynthesis"in window)||myEpoch!==epoch)return;const u=new SpeechSynthesisUtterance(text);u.rate=1.02;u.onstart=()=>{if(myEpoch===epoch){state("Speaking","You can interrupt me at any time.","speaking");ev("NATIVE_AUDIO_CHUNK",{state:"speech_start"})}};u.onend=()=>{if(myEpoch===epoch){state("Ready","Tap the microphone for another turn.");ev("CONTROL_END",{state:"speech_end"})}};speechSynthesis.speak(u)}
async function ask(q){if(!q.trim())return;if(!pipe){state("Model not loaded","Tap “Load model on this device” first.");return}const my=++epoch;msg("user",q);ev("TEXT_DELTA",{role:"user",text:q});state("Thinking","Small model is generating locally…","thinking");const t0=performance.now();try{const out=await pipe([{role:"system",content:"You are LeeWay Agent Voice, a concise conversational test assistant. Speak naturally in plain text. No markdown, URLs, lists, or emoji. Keep answers brief enough for spoken conversation."},{role:"user",content:q}],{max_new_tokens:112,temperature:.45,do_sample:true});if(my!==epoch){ev("SEMANTIC_EVENT",{name:"STALE_GENERATION_REJECTED",staleEpoch:my});return}const g=out?.[0]?.generated_text;let a=Array.isArray(g)?g.at(-1)?.content:String(g??"");a=(a||"I did not produce a response.").trim();msg("agent",a);ev("TEXT_DELTA",{role:"assistant",text:a,latencyMs:performance.now()-t0});speak(a,my)}catch(e){if(my!==epoch)return;state("Inference error","See diagnostics.");ev("ERROR",{stage:"inference",message:String(e)})}}
$("send").onclick=()=>{const q=$("text").value;$("text").value="";ask(q)};
$("mic").onclick=()=>{if(!SR){state("Mic transcription unavailable","Your browser does not expose SpeechRecognition here. Type below; audio output can still work.");ev("ERROR",{stage:"mic",message:"SpeechRecognition unavailable"});return}stopAll("new_user_turn");recognizer=new SR();recognizer.continuous=false;recognizer.interimResults=true;recognizer.lang=navigator.language||"en-US";let finalText="";recognizer.onstart=()=>{state("Listening","Speak now…","listening");ev("SEMANTIC_EVENT",{name:"MIC_START"})};recognizer.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t}$("text").value=finalText||interim;ev("TEXT_DELTA",{role:"user_interim",text:finalText||interim})};recognizer.onend=()=>{recognizer=null;const q=finalText.trim()||$("text").value.trim();if(q){$("text").value="";ask(q)}else state("Ready","I did not detect speech. Try again.")};recognizer.onerror=e=>{ev("ERROR",{stage:"speech_recognition",message:e.error});state("Microphone error",e.error)};recognizer.start()};
</script></main></body></html>
