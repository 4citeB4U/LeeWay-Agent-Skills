---
# LEEWAY AGENT CONFIGURATION
# Machine-readable runtime contract
# Framework: LeeWay Standards + Lifelong Learning + Formula Governance

agent_system:
  version: "1.1.0"
  name: "LeeWay Living Skill University"
  target_audience: "LLM and governed agent runtimes"
  purpose: "Persistent skill authority, evidence-governed composition, lifelong learning, emerging-skill promotion, reference literacy, and quantum readiness"
  canonical_repository: "4citeB4U/LeeWay-Agent-Skills"

agent:
  id: "agent-lee"
  model_compatible: ["any"]
  deployment_mode: "continuous_when_hosted"
  core_features:
    - skill_authority_bootstrap
    - per_message_ingress_check
    - context_engineering
    - formula_governance
    - skill_composition
    - skill_lifecycle
    - workflow_orchestration
    - lifelong_learning
    - reference_authority
    - quantum_readiness
    - memory_persistence
    - pattern_extraction

bootstrap:
  skill: "./skills/leeway-bootstrap-authority/SKILL.md"
  required_on_first_substantive_interaction: true
  session_receipt: "LEEWAY_SKILL_SESSION_RECEIPT"
  fail_closed_if_refresh_required_and_unavailable: true
  on_startup:
    - verify_canonical_repository_authority
    - verify_core_skill_registry
    - load_workflow_registry
    - load_existing_governed_memory
    - verify_formula_authority_state
    - verify_compliance
    - establish_skill_session_receipt

message_ingress:
  skill: "./skills/leeway-message-ingress-authority/SKILL.md"
  check_every_user_message: true
  reload_only_when_needed: true
  refresh_triggers:
    - receipt_missing
    - receipt_unknown
    - receipt_stale
    - receipt_contradictory
    - authority_changed
    - runtime_requires_new_receipt

skills:
  registry_path: "./skills"
  registry_format: "SKILL.md"
  auto_discover: true
  constitutional_core:
    - leeway-bootstrap-authority
    - leeway-continuity-authority
    - leeway-message-ingress-authority
    - leeway-context-engineering
    - leeway-formula-governance
    - leeway-skill-lifecycle-governance
    - leeway-reference-authority
    - leeway-human-conversation
    - leeway-og-expressive-identity
  conditional_core:
    - leeway-quantum-readiness

  execution:
    mastery_scoring: true
    activation_priority_scoring: true
    criticality_scoring: true
    evidence_quality_tracking: true
    recency_tracking: true
    compatibility_tracking: true
    parameter_optimization: true
    token_budgeting: true
    quality_evaluation: true

  mastery_tracking:
    enabled: true
    update_frequency: "verified_execution_only"
    law: "mastery is capability quality; inactivity alone does not reduce mastery"
    components:
      verified_success_rate: 0.45
      verification_quality: 0.25
      robustness_across_contexts: 0.15
      efficiency: 0.10
      quality_trend: 0.05
    forbidden_inputs:
      - raw_reuse_frequency_as_mastery
      - popularity
      - model_confidence_without_evidence
    thresholds:
      novice: "0.00-0.33"
      intermediate: "0.34-0.66"
      expert: "0.67-1.00"

  activation_priority:
    independent_from_mastery: true
    factors:
      - current_task_relevance
      - dependency_requirement
      - criticality
      - recency
      - runtime_compatibility
      - verified_performance
      - replacement_quality
    cooling_path: ["ACTIVE", "WARM", "DORMANT"]
    cooling_reduces_mastery: false

  lifecycle:
    skill: "./skills/leeway-skill-lifecycle-governance/SKILL.md"
    states:
      - CORE_ALWAYS_ON
      - ACTIVE
      - WARM
      - DORMANT
      - CANDIDATE
      - SANDBOXED
      - VERIFIED
      - PROMOTED
      - DEPRECATED
      - RETIRED
      - QUARANTINED
    inactivity_decay_exempt:
      - constitutional_governance
      - safety
      - security
      - recovery
      - compliance
      - failover
      - creator_pinned
    emerging_skill_pipeline:
      - DISCOVER
      - SOURCE
      - PROVENANCE
      - COMPATIBILITY
      - SANDBOX
      - BENCHMARK
      - VERITAS
      - RECEIPT
      - PROMOTE
    revalidate_on:
      - material_upstream_version_change
      - api_or_standard_change
      - security_posture_change
      - license_change
      - hardware_runtime_change
      - contradictory_runtime_evidence

  composition:
    policy: "minimum_sufficient_skill_graph"
    auto_load_required_skills: true
    relationships:
      - requires
      - supports
      - verifies
      - criticizes
      - fallback_for
      - supersedes
      - conflicts_with
      - quantum_accelerable
      - classical_fallback
    preserve_shared_provenance: true
    preserve_common_receipt_boundary: true
    do_not_load_entire_registry_by_default: true

workflows:
  registry_path: "./workflows"
  registry_format: "WORKFLOW.md"
  auto_discover: true
  execution_modes:
    - sequential
    - parallel
    - hierarchical
    - event_driven
    - state_machine
  intelligence:
    learn_optimal_ordering: true
    learn_parameters: true
    learn_branching: true
    adapt_to_failure: true
    require_verified_outcomes_for_promotion: true

formula_governance:
  skill: "./skills/leeway-formula-governance/SKILL.md"
  formula_execution_separate_from_runtime_execution: true
  preserve_when_available:
    - formulaImplementation
    - formulaVersion
    - formulaAuthorityHash
    - inputState
    - inputStateHash
    - inputProvenance
    - contextState
    - contextStateHash
    - selectedPolicy
    - selectedAction
    - selectedRoute
    - decisionHash
    - runtimeExecutionResult
    - veritasMeasurements
    - receiptId
    - receiptHash
  never_fabricate:
    - C64
    - Q69
    - formula_score
    - ranking
    - authority_hash
    - decision_hash
    - runtime_result
    - receipt

reference_authority:
  enabled: true
  skill: "./skills/leeway-reference-authority/SKILL.md"
  source_classes:
    - PRIMARY
    - SECONDARY
    - TERTIARY
    - COMMUNITY
    - HISTORICAL
    - LEEWAY_NATIVE
  source_mesh: "claim -> strongest_source -> corroboration -> conflict_check -> synthesis"
  citation_policy: "density proportional to claim stakes and verification need"
  goal: "maximum useful reference density per claim"
  prohibit_fabricated_references: true
  distinguish_retrieved_sources_from_general_model_knowledge: true
  memory_fields:
    - source_identity
    - canonical_locator
    - source_class
    - version_or_date
    - verified_at
    - supported_claims
    - contradictions
    - limitations
    - provenance_hash_or_receipt
    - supersession_relationship

quantum_readiness:
  enabled: true
  skill: "./skills/leeway-quantum-readiness/SKILL.md"
  mode: "hybrid_ready_classical_safe"
  quantum_aware_not_quantum_executed: true
  classical_fallback_required_unless_inherently_quantum: true
  states:
    - QUANTUM_NOT_RELEVANT
    - QUANTUM_AWARE_CLASSICAL_ONLY
    - QUANTUM_SIMULATOR_AVAILABLE
    - QUANTUM_HARDWARE_AVAILABLE
    - QUANTUM_HYBRID_EXECUTED
    - QUANTUM_EXECUTED
    - QUANTUM_BLOCKED
    - QUANTUM_FAILED
  distinguish:
    - simulator_vs_hardware
    - theoretical_vs_measured_advantage
    - mitigation_vs_error_correction
    - noisy_hardware_vs_fault_tolerant_projection
  backend_neutral_problem_contracts: true
  preserve_evidence_when_available:
    - provider
    - backend
    - runtime_version
    - circuit_or_program_identity
    - circuit_or_program_hash
    - compilation_settings
    - problem_size
    - shots_or_sampling_policy
    - seed
    - job_or_execution_id
    - calibration_or_noise_snapshot
    - mitigation_method
    - raw_result
    - classical_preprocessing
    - classical_postprocessing
    - comparison_baseline
    - veritas
    - receipt

learning:
  enabled: true
  law: "only verified outcomes may alter mastery, lifecycle promotion, semantic rules, or procedural authority"
  memory_system:
    root: "./memory"
    episodic:
      enabled: true
      retention: "governed"
      auto_compress: true
      compress_after_episodes: 1000
      directory: "./memory/episodes"
    semantic:
      enabled: true
      auto_extraction: true
      extraction_interval_episodes: 10
      min_verified_success_rate_for_pattern: 0.80
      directory: "./memory/semantic"
    procedural:
      enabled: true
      auto_save: true
      min_verified_success_rate: 0.85
      directory: "./memory/procedural"
    references:
      enabled: true
      directory: "./memory/references"
      preserve_provenance: true
    lifecycle:
      enabled: true
      directory: "./memory/skill-lifecycle"

  learning_loop:
    phases:
      1: authority_check
      2: perception_context
      3: formula_decision
      4: skill_composition
      5: action
      6: verification_veritas
      7: memory_reference_update
      8: lifecycle_update
      9: next_decision
    execution: "every_substantive_skill_use"

  pattern_extraction:
    enabled: true
    triggers:
      - verified_success
      - verified_failure
      - pattern_stability
      - contradiction
      - upstream_change
    patterns_stored:
      - trigger_conditions
      - parameter_optimization
      - failure_modes
      - workflow_orderings
      - efficiency_gains
      - reference_relationships
      - skill_combinations
      - supersession_patterns

compliance:
  framework: "LeeWay Standards"
  mode: "continuous_monitoring"
  enforced_policies:
    - NO_SECRETS_IN_CODE
    - PROVENANCE_REQUIRED_FOR_PROMOTION
    - NO_FABRICATED_RECEIPTS
    - NO_FABRICATED_REFERENCES
    - FORMULA_EXECUTION_SEPARATE_FROM_RUNTIME
    - QUANTUM_CLAIMS_REQUIRE_QUANTUM_EVIDENCE
  compliance_agents:
    compliance_monitor: "active"
    skill_validator: "per_skill_update"
    autonomy_auditor: "continuous"
    lifecycle_auditor: "continuous"
    reference_auditor: "on_material_research"

metrics:
  tracking_enabled: true
  per_skill:
    - mastery_score
    - activation_priority
    - criticality
    - evidence_quality
    - recency
    - compatibility
    - lifecycle_state
    - verified_success_rate
    - efficiency_score
    - quality_trend
  per_workflow:
    - execution_count
    - verified_success_rate
    - optimal_skill_orders
    - learned_parameters
    - performance_trend
  agent_wide:
    - total_verified_episodes
    - skills_by_lifecycle_state
    - promoted_emerging_skills
    - deprecated_skills
    - quarantined_skills
    - verified_reference_nodes
    - procedural_automations_saved
    - quantum_execution_count

skill_execution_flow:
  ingress_phase:
    1: validate_skill_session_receipt
    2: refresh_authority_if_required
  load_phase:
    1: recover_continuity
    2: resolve_context
    3: obtain_formula_route
    4: build_minimum_sufficient_skill_graph
    5: retrieve_relevant_verified_patterns_and_references
  execute_phase:
    1: initialize_selected_skills
    2: monitor_runtime_state
    3: preserve_execution_identity
    4: record_raw_result
  evaluate_phase:
    1: run_acceptance_checks
    2: run_veritas_when_required
    3: identify_failure_boundary
    4: compare_to_reference_and_runtime_authority
  update_phase:
    1: store_verified_episode
    2: update_semantic_patterns_if_qualified
    3: update_procedural_memory_if_qualified
    4: update_mastery_from_verified_execution
    5: update_activation_priority_independently
    6: update_lifecycle_state_if_evidence_justifies

integrations:
  with_skills:
    - discover
    - verify
    - compose
    - execute
    - cool_or_promote_without_amnesia
  with_workflows:
    - orchestrate_verified_skill_graphs
    - learn_optimal_orderings
  with_mcp:
    - expose_governed_skills_and_workflows_when_supported
    - preserve_execution_state_distinctions
  with_quantum:
    - expose_backend_adapters_when_verified
    - preserve_classical_fallback
  with_leeway_standards:
    - preserve_formula_authority
    - preserve_veritas_receipts
    - preserve_reference_provenance
    - preserve_learning_ledger_boundaries

core_beliefs:
  - "A living skill library grows without forgetting why a capability was trusted."
  - "Inactivity changes activation priority, not verified mastery."
  - "New technology earns promotion through evidence."
  - "Broad knowledge is useful; fabricated references are not."
  - "Quantum readiness means being able to route real quantum capability without pretending classical execution is quantum."
  - "Formula decides; runtime executes; Veritas measures; receipts bind; learning follows proof."

status:
  governance_contract: "ACTIVE"
  learning_enabled: true
  lifecycle_enabled: true
  reference_authority_enabled: true
  quantum_readiness_enabled: true
  runtime_truth: "HOST_DEPENDENT"
